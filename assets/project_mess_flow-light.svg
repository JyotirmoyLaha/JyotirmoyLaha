<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 130" width="850" height="130" role="img" aria-label="Mess Manager architecture: Google sign-in gated by Firestore security rules, expenses written to a shared ledger, onSnapshot listeners fan changes out to every client, and the Expo app exports statements as PDF.">
  <defs>
    <linearGradient id="mmf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="mmf-node" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
  </defs>

  <rect x="0.75" y="0.75" width="848.5" height="128.5" rx="14" fill="url(#mmf-bg)" stroke="#d0d7de" stroke-width="1.5"/>

  <g>
    <line x1="210" y1="65" x2="230" y2="65" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="3 4"/>
    <path d="M224,61.5 L230,65 L224,68.5" fill="none" stroke="#2563eb" stroke-opacity="0.7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cy="65" r="2.6" fill="#2563eb">
      <animate attributeName="cx" values="210;228" dur="2.2s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" begin="0s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <line x1="414" y1="65" x2="434" y2="65" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="3 4"/>
    <path d="M428,61.5 L434,65 L428,68.5" fill="none" stroke="#2563eb" stroke-opacity="0.7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cy="65" r="2.6" fill="#2563eb">
      <animate attributeName="cx" values="414;432" dur="2.2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <line x1="618" y1="65" x2="638" y2="65" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="3 4"/>
    <path d="M632,61.5 L638,65 L632,68.5" fill="none" stroke="#2563eb" stroke-opacity="0.7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cy="65" r="2.6" fill="#2563eb">
      <animate attributeName="cx" values="618;636" dur="2.2s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <rect x="28" y="28" width="180" height="74" rx="10" fill="url(#mmf-node)" stroke="#d0d7de" stroke-width="1.2"/>
    <rect x="40" y="39" width="19" height="17" rx="4" fill="#2563eb" fill-opacity="0.16" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1"/>
    <text x="49.5" y="51" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="9" font-weight="700" fill="#2563eb">01</text>
    <text x="66" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1f2328">Google Sign-In</text>
    <text x="40" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" fill="#59636e">Access gated by</text>
    <text x="40" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" fill="#59636e">firestore.rules.</text>
  </g>
  <g>
    <rect x="232" y="28" width="180" height="74" rx="10" fill="url(#mmf-node)" stroke="#d0d7de" stroke-width="1.2"/>
    <rect x="244" y="39" width="19" height="17" rx="4" fill="#2563eb" fill-opacity="0.16" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1"/>
    <text x="253.5" y="51" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="9" font-weight="700" fill="#2563eb">02</text>
    <text x="270" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1f2328">Log Expense</text>
    <text x="244" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" fill="#59636e">Meals and costs written to</text>
    <text x="244" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" fill="#59636e">the shared Firestore ledger.</text>
  </g>
  <g>
    <rect x="436" y="28" width="180" height="74" rx="10" fill="url(#mmf-node)" stroke="#d0d7de" stroke-width="1.2"/>
    <rect x="448" y="39" width="19" height="17" rx="4" fill="#2563eb" fill-opacity="0.16" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1"/>
    <text x="457.5" y="51" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="9" font-weight="700" fill="#2563eb">03</text>
    <text x="474" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1f2328">Live Sync</text>
    <text x="448" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" fill="#59636e">onSnapshot listeners push</text>
    <text x="448" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" fill="#59636e">updates to every client.</text>
  </g>
  <g>
    <rect x="640" y="28" width="180" height="74" rx="10" fill="url(#mmf-node)" stroke="#d0d7de" stroke-width="1.2"/>
    <rect x="652" y="39" width="19" height="17" rx="4" fill="#2563eb" fill-opacity="0.16" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1"/>
    <text x="661.5" y="51" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="9" font-weight="700" fill="#2563eb">04</text>
    <text x="678" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1f2328">Split + Export</text>
    <text x="652" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" fill="#59636e">Balances split per member;</text>
    <text x="652" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" fill="#59636e">expo-print emits a PDF.</text>
  </g>
</svg>
