<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="850" height="180" role="img" aria-label="AI Resume Analyzer — AI-powered resume scoring and feedback tool">
  <defs>
    <linearGradient id="ra-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0f1420"/>
    </linearGradient>
    <linearGradient id="ra-spine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="ra-rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>
    <filter id="ra-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- card -->
  <rect x="0.75" y="0.75" width="848.5" height="178.5" rx="14" fill="url(#ra-bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- ambient wash behind the artwork -->
  <circle cx="726" cy="90" r="70" fill="#00F2FE" opacity="0.10" filter="url(#ra-soft)"/>

  <!-- accent spine -->
  <rect x="0.75" y="18" width="3" height="144" rx="1.5" fill="url(#ra-spine)"/>

  <!-- title -->
  <rect x="28" y="34" width="8" height="8" rx="1.6" fill="#00F2FE" transform="rotate(45 32 38)"/>
  <text x="48" y="43" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="0.1" fill="#e6edf3">AI Resume Analyzer</text>

  <!-- status pill — kept inside the text column so it can never collide
       with the artwork panel on the right -->
  <g transform="translate(522, 27)">
    <rect width="78" height="21" rx="10.5" fill="#161b22" stroke="#00F2FE" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="14" cy="10.5" r="3.2" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="25" y="14.5" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#8b949e">LIVE</text>
  </g>

  <!-- rule -->
  <rect x="28" y="57" width="572" height="1.1" fill="url(#ra-rule)"/>

  <!-- column separator -->
  <line x1="626" y1="30" x2="626" y2="150" stroke="#30363d" stroke-width="1" stroke-dasharray="3 5" opacity="0.8"/>

  <!-- description -->
  <text x="28" y="83" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">Upload a resume and get AI-scored feedback on structure, keywords and</text>
  <text x="28" y="103" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">role fit — parsed server-side, rendered as an actionable report.</text>

  <!-- tech pills -->
    <g transform="translate(28, 120)">
      <rect width="53" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="26.5" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#c9d1d9">React</text>
    </g>
    <g transform="translate(88, 120)">
      <rect width="66" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="33" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#c9d1d9">Node.js</text>
    </g>
    <g transform="translate(161, 120)">
      <rect width="66" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="33" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#c9d1d9">Express</text>
    </g>
    <g transform="translate(234, 120)">
      <rect width="60" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="30" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#c9d1d9">Python</text>
    </g>
    <g transform="translate(301, 120)">
      <rect width="40" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="20" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#c9d1d9">NLP</text>
    </g>
    <g transform="translate(348, 120)">
      <rect width="73" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="36.5" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#c9d1d9">REST API</text>
    </g>
    <g transform="translate(428, 120)">
      <rect width="73" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="36.5" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#c9d1d9">Tailwind</text>
    </g>

  <!-- artwork -->
  <g transform="translate(684, 30)">
    <rect x="10" y="6" width="86" height="112" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
    <rect x="24" y="22" width="42" height="5" rx="2.5" fill="#3B82F6"/>
    <g fill="#30363d">
      <rect x="24" y="38" width="58" height="4" rx="2"/>
      <rect x="24" y="50" width="48" height="4" rx="2"/>
      <rect x="24" y="62" width="58" height="4" rx="2"/>
      <rect x="24" y="74" width="38" height="4" rx="2"/>
      <rect x="24" y="86" width="52" height="4" rx="2"/>
      <rect x="24" y="98" width="30" height="4" rx="2"/>
    </g>
    <!-- scan beam -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,96; 0,0" dur="4.5s" repeatCount="indefinite"/>
      <rect x="12" y="14" width="82" height="14" fill="#00F2FE" opacity="0.16"/>
      <rect x="12" y="27" width="82" height="1.6" fill="#00F2FE" opacity="0.95"/>
    </g>
    <!-- score ring -->
    <g transform="translate(84, 96)">
      <circle r="20" fill="#0d1117" stroke="#30363d" stroke-width="3"/>
      <circle r="20" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-dasharray="126" stroke-dashoffset="126" transform="rotate(-90)">
        <animate attributeName="stroke-dashoffset" values="126;28;28;126" keyTimes="0;0.35;0.85;1" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <text y="4.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="13" font-weight="700" fill="#3fb950">AI</text>
    </g>
  </g>
</svg>
