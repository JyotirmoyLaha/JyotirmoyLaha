<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="850" height="180" role="img" aria-label="J.SkyCast Weather — live weather app using WeatherAPI and geolocation">
  <defs>
    <linearGradient id="wx-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="wx-spine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#0891b2" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="wx-rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </linearGradient>
    <filter id="wx-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- card -->
  <rect x="0.75" y="0.75" width="848.5" height="178.5" rx="14" fill="url(#wx-bg)" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- ambient wash behind the artwork -->
  <circle cx="726" cy="90" r="70" fill="#0891b2" opacity="0.10" filter="url(#wx-soft)"/>

  <!-- accent spine -->
  <rect x="0.75" y="18" width="3" height="144" rx="1.5" fill="url(#wx-spine)"/>

  <!-- title -->
  <rect x="28" y="34" width="8" height="8" rx="1.6" fill="#0891b2" transform="rotate(45 32 38)"/>
  <text x="48" y="43" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="0.1" fill="#1f2328">J.SkyCast Weather</text>

  <!-- status pill — kept inside the text column so it can never collide
       with the artwork panel on the right -->
  <g transform="translate(522, 27)">
    <rect width="78" height="21" rx="10.5" fill="#f6f8fa" stroke="#0891b2" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="14" cy="10.5" r="3.2" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="25" y="14.5" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#59636e">LIVE</text>
  </g>

  <!-- rule -->
  <rect x="28" y="57" width="572" height="1.1" fill="url(#wx-rule)"/>

  <!-- column separator -->
  <line x1="626" y1="30" x2="626" y2="150" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 5" opacity="0.8"/>

  <!-- description -->
  <text x="28" y="83" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#59636e">Live conditions and forecasts from WeatherAPI via city search or</text>
  <text x="28" y="103" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#59636e">geolocation, surfacing AQI, UV index and astronomy data.</text>

  <!-- tech pills -->
    <g transform="translate(28, 120)">
      <rect width="53" height="22" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
      <text x="26.5" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#3d444d">HTML5</text>
    </g>
    <g transform="translate(88, 120)">
      <rect width="46" height="22" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
      <text x="23" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#3d444d">CSS3</text>
    </g>
    <g transform="translate(141, 120)">
      <rect width="86" height="22" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
      <text x="43" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#3d444d">JavaScript</text>
    </g>
    <g transform="translate(234, 120)">
      <rect width="86" height="22" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
      <text x="43" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#3d444d">WeatherAPI</text>
    </g>
    <g transform="translate(327, 120)">
      <rect width="93" height="22" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
      <text x="46.5" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#3d444d">Geolocation</text>
    </g>
    <g transform="translate(427, 120)">
      <rect width="73" height="22" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
      <text x="36.5" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#3d444d">AQI + UV</text>
    </g>

  <!-- artwork -->
  <g transform="translate(676, 38)">
    <!-- sun -->
    <g transform="translate(30, 26)">
      <circle r="15" fill="#fbbf24" opacity="0.95"/>
      <g stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="26s" repeatCount="indefinite"/>
        <line x1="0" y1="-22" x2="0" y2="-27"/>
        <line x1="0" y1="22" x2="0" y2="27"/>
        <line x1="-22" y1="0" x2="-27" y2="0"/>
        <line x1="22" y1="0" x2="27" y2="0"/>
        <line x1="-15.5" y1="-15.5" x2="-19" y2="-19"/>
        <line x1="15.5" y1="15.5" x2="19" y2="19"/>
        <line x1="-15.5" y1="15.5" x2="-19" y2="19"/>
        <line x1="15.5" y1="-15.5" x2="19" y2="-19"/>
      </g>
    </g>
    <!-- cloud -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 5,-4; 0,0" dur="6s" repeatCount="indefinite"/>
      <path d="M40,74 A17,17 0 0,1 57,57 A21,21 0 0,1 96,52 A16,16 0 0,1 100,74 Z" fill="#0284c7" opacity="0.28"/>
      <path d="M40,74 A17,17 0 0,1 57,57 A21,21 0 0,1 96,52 A16,16 0 0,1 100,74 Z" fill="none" stroke="#0284c7" stroke-width="1.6" opacity="0.9"/>
    </g>
    <!-- rain -->
    <g stroke="#0891b2" stroke-width="2.2" stroke-linecap="round">
      <line x1="54" y1="82" x2="50" y2="94" opacity="0.8">
        <animate attributeName="opacity" values="0;0.9;0" dur="1.5s" repeatCount="indefinite"/>
      </line>
      <line x1="70" y1="82" x2="66" y2="94" opacity="0.8">
        <animate attributeName="opacity" values="0;0.9;0" dur="1.5s" begin="-0.5s" repeatCount="indefinite"/>
      </line>
      <line x1="86" y1="82" x2="82" y2="94" opacity="0.8">
        <animate attributeName="opacity" values="0;0.9;0" dur="1.5s" begin="-1s" repeatCount="indefinite"/>
      </line>
    </g>
    <!-- temp readout -->
    <text x="70" y="118" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="15" font-weight="700" fill="#1f2328">28°C</text>
  </g>
</svg>
