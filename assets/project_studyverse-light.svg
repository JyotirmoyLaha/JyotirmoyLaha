<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="850" height="180" role="img" aria-label="StudyVerse — zen study and life journal with real-time sync">
  <defs>
    <linearGradient id="sv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="sv-spine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="sv-rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="sv-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- card -->
  <rect x="0.75" y="0.75" width="848.5" height="178.5" rx="14" fill="url(#sv-bg)" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- ambient wash behind the artwork -->
  <circle cx="726" cy="90" r="70" fill="#7c3aed" opacity="0.10" filter="url(#sv-soft)"/>

  <!-- accent spine -->
  <rect x="0.75" y="18" width="3" height="144" rx="1.5" fill="url(#sv-spine)"/>

  <!-- title -->
  <rect x="28" y="34" width="8" height="8" rx="1.6" fill="#7c3aed" transform="rotate(45 32 38)"/>
  <text x="48" y="43" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="0.1" fill="#1f2328">StudyVerse</text>

  <!-- status pill — kept inside the text column so it can never collide
       with the artwork panel on the right -->
  <g transform="translate(522, 27)">
    <rect width="78" height="21" rx="10.5" fill="#f6f8fa" stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="14" cy="10.5" r="3.2" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="25" y="14.5" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#59636e">LIVE</text>
  </g>

  <!-- rule -->
  <rect x="28" y="57" width="572" height="1.1" fill="url(#sv-rule)"/>

  <!-- column separator -->
  <line x1="626" y1="30" x2="626" y2="150" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 5" opacity="0.8"/>

  <!-- description -->
  <text x="28" y="83" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#59636e">Zen-inspired daily study &amp; life journal with real-time Firestore sync,</text>
  <text x="28" y="103" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#59636e">streak tracking, image attachments and full light/dark theming.</text>

  <!-- tech pills -->
    <g transform="translate(28, 120)">
      <rect width="53" height="22" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
      <text x="26.5" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#3d444d">HTML5</text>
    </g>
    <g transform="translate(88, 120)">
      <rect width="46" height="22" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
      <text x="23" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#3d444d">CSS3</text>
    </g>
    <g transform="translate(141, 120)">
      <rect width="86" height="22" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
      <text x="43" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#3d444d">JavaScript</text>
    </g>
    <g transform="translate(234, 120)">
      <rect width="73" height="22" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
      <text x="36.5" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#3d444d">Firebase</text>
    </g>
    <g transform="translate(314, 120)">
      <rect width="79" height="22" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
      <text x="39.5" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#3d444d">Firestore</text>
    </g>
    <g transform="translate(400, 120)">
      <rect width="93" height="22" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
      <text x="46.5" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#3d444d">Google Auth</text>
    </g>
    <g transform="translate(500, 120)">
      <rect width="86" height="22" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
      <text x="43" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#3d444d">Canvas API</text>
    </g>

  <!-- artwork -->
  <g transform="translate(672, 40)">
    <ellipse cx="56" cy="112" rx="40" ry="5.5" fill="#000000" opacity="0.35"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-7; 0,0" dur="5.5s" repeatCount="indefinite"/>
      <polygon points="56,52 16,30 16,70 56,92" fill="#4c1d95"/>
      <polygon points="56,52 96,30 96,70 56,92" fill="#5b21b6"/>
      <polygon points="53,48 18,28 18,66 53,86" fill="#7c3aed"/>
      <polygon points="59,48 94,28 94,66 59,86" fill="#a78bfa"/>
      <line x1="56" y1="48" x2="56" y2="88" stroke="#7c3aed" stroke-width="2"/>
      <g stroke="#6d28d9" stroke-width="1.2" opacity="0.75">
        <line x1="24" y1="40" x2="47" y2="53"/>
        <line x1="24" y1="48" x2="47" y2="61"/>
        <line x1="65" y1="53" x2="88" y2="40"/>
        <line x1="65" y1="61" x2="88" y2="48"/>
      </g>
    </g>
    <path d="M18,14 A11,11 0 0,0 35,27 A12,12 0 0,1 18,14" fill="#a78bfa" opacity="0.9"/>
    <polygon points="88,6 89.6,10 94,10 90.4,12.8 91.8,17 88,14.4 84.2,17 85.6,12.8 82,10 86.4,10" fill="#0891b2" opacity="0.8">
      <animate attributeName="opacity" values="0.25;0.95;0.25" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="70,20 71.2,23 74.4,23 71.8,25 72.8,28 70,26.2 67.2,28 68.2,25 65.6,23 68.8,23" fill="#7c3aed" opacity="0.7">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.6s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg>
