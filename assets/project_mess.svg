<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="850" height="180" role="img" aria-label="Mess Manager — hostel mess billing and attendance manager">
  <defs>
    <linearGradient id="mm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0f1420"/>
    </linearGradient>
    <linearGradient id="mm-spine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="mm-rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <filter id="mm-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- card -->
  <rect x="0.75" y="0.75" width="848.5" height="178.5" rx="14" fill="url(#mm-bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- ambient wash behind the artwork -->
  <circle cx="726" cy="90" r="70" fill="#3B82F6" opacity="0.10" filter="url(#mm-soft)"/>

  <!-- accent spine -->
  <rect x="0.75" y="18" width="3" height="144" rx="1.5" fill="url(#mm-spine)"/>

  <!-- title -->
  <rect x="28" y="34" width="8" height="8" rx="1.6" fill="#3B82F6" transform="rotate(45 32 38)"/>
  <text x="48" y="43" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="0.1" fill="#e6edf3">Mess Manager</text>

  <!-- status pill — kept inside the text column so it can never collide
       with the artwork panel on the right -->
  <g transform="translate(522, 27)">
    <rect width="78" height="21" rx="10.5" fill="#161b22" stroke="#3B82F6" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="14" cy="10.5" r="3.2" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="25" y="14.5" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#8b949e">LIVE</text>
  </g>

  <!-- rule -->
  <rect x="28" y="57" width="572" height="1.1" fill="url(#mm-rule)"/>

  <!-- column separator -->
  <line x1="626" y1="30" x2="626" y2="150" stroke="#30363d" stroke-width="1" stroke-dasharray="3 5" opacity="0.8"/>

  <!-- description -->
  <text x="28" y="83" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">Tracks hostel mess attendance, per-member consumption and monthly dues,</text>
  <text x="28" y="103" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">with automated bill splitting and an exportable ledger.</text>

  <!-- tech pills -->
    <g transform="translate(28, 120)">
      <rect width="53" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="26.5" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#c9d1d9">HTML5</text>
    </g>
    <g transform="translate(88, 120)">
      <rect width="46" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="23" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#c9d1d9">CSS3</text>
    </g>
    <g transform="translate(141, 120)">
      <rect width="86" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="43" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#c9d1d9">JavaScript</text>
    </g>
    <g transform="translate(234, 120)">
      <rect width="66" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="33" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#c9d1d9">Node.js</text>
    </g>
    <g transform="translate(307, 120)">
      <rect width="66" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="33" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#c9d1d9">Express</text>
    </g>
    <g transform="translate(380, 120)">
      <rect width="66" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="33" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#c9d1d9">MongoDB</text>
    </g>

  <!-- artwork -->
  <g transform="translate(668, 32)">
    <!-- attendance calendar -->
    <rect x="8" y="12" width="96" height="86" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
    <path d="M8,20 A8,8 0 0,1 16,12 L96,12 A8,8 0 0,1 104,20 L104,32 L8,32 Z" fill="#3B82F6" opacity="0.9"/>
    <rect x="26" y="5" width="5" height="13" rx="2.5" fill="#8b949e"/>
    <rect x="81" y="5" width="5" height="13" rx="2.5" fill="#8b949e"/>
    <!-- day cells -->
    <g fill="#0d1117" stroke="#30363d" stroke-width="0.9">
      <rect x="17" y="40" width="13" height="12" rx="2.5"/>
      <rect x="34" y="40" width="13" height="12" rx="2.5"/>
      <rect x="51" y="40" width="13" height="12" rx="2.5"/>
      <rect x="68" y="40" width="13" height="12" rx="2.5"/>
      <rect x="85" y="40" width="13" height="12" rx="2.5"/>
      <rect x="17" y="57" width="13" height="12" rx="2.5"/>
      <rect x="34" y="57" width="13" height="12" rx="2.5"/>
      <rect x="51" y="57" width="13" height="12" rx="2.5"/>
      <rect x="68" y="57" width="13" height="12" rx="2.5"/>
      <rect x="85" y="57" width="13" height="12" rx="2.5"/>
      <rect x="17" y="74" width="13" height="12" rx="2.5"/>
      <rect x="34" y="74" width="13" height="12" rx="2.5"/>
      <rect x="51" y="74" width="13" height="12" rx="2.5"/>
    </g>
    <!-- marked-present cells -->
    <g fill="#3fb950" opacity="0.85">
      <rect x="17" y="40" width="13" height="12" rx="2.5"/>
      <rect x="34" y="40" width="13" height="12" rx="2.5"/>
      <rect x="68" y="40" width="13" height="12" rx="2.5"/>
      <rect x="17" y="57" width="13" height="12" rx="2.5"/>
      <rect x="51" y="57" width="13" height="12" rx="2.5"/>
      <rect x="85" y="57" width="13" height="12" rx="2.5"/>
      <rect x="34" y="74" width="13" height="12" rx="2.5">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.55;1" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- running total -->
    <g transform="translate(96, 88)">
      <circle r="17" fill="#0d1117" stroke="#3B82F6" stroke-width="1.6"/>
      <text y="4.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="12" font-weight="700" fill="#38bdf8">₹</text>
    </g>
  </g>
</svg>
