<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="850" height="180" role="img" aria-label="Personal Portfolio — responsive personal portfolio site">
  <defs>
    <linearGradient id="pf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0f1420"/>
    </linearGradient>
    <linearGradient id="pf-spine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="pf-rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <filter id="pf-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- card -->
  <rect x="0.75" y="0.75" width="848.5" height="178.5" rx="14" fill="url(#pf-bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- ambient wash behind the artwork -->
  <circle cx="726" cy="90" r="70" fill="#8B5CF6" opacity="0.10" filter="url(#pf-soft)"/>

  <!-- accent spine -->
  <rect x="0.75" y="18" width="3" height="144" rx="1.5" fill="url(#pf-spine)"/>

  <!-- title -->
  <rect x="28" y="34" width="8" height="8" rx="1.6" fill="#8B5CF6" transform="rotate(45 32 38)"/>
  <text x="48" y="43" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="0.1" fill="#e6edf3">Personal Portfolio</text>

  <!-- status pill — kept inside the text column so it can never collide
       with the artwork panel on the right -->
  <g transform="translate(522, 27)">
    <rect width="78" height="21" rx="10.5" fill="#161b22" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="14" cy="10.5" r="3.2" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="25" y="14.5" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#8b949e">LIVE</text>
  </g>

  <!-- rule -->
  <rect x="28" y="57" width="572" height="1.1" fill="url(#pf-rule)"/>

  <!-- column separator -->
  <line x1="626" y1="30" x2="626" y2="150" stroke="#30363d" stroke-width="1" stroke-dasharray="3 5" opacity="0.8"/>

  <!-- description -->
  <text x="28" y="83" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">Responsive single-page portfolio with scroll-driven animation, project</text>
  <text x="28" y="103" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">showcase and a working contact pipeline.</text>

  <!-- tech pills -->
    <g transform="translate(28, 120)">
      <rect width="53" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="26.5" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#c9d1d9">HTML5</text>
    </g>
    <g transform="translate(88, 120)">
      <rect width="46" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="23" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#c9d1d9">CSS3</text>
    </g>
    <g transform="translate(141, 120)">
      <rect width="86" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="43" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#c9d1d9">JavaScript</text>
    </g>
    <g transform="translate(234, 120)">
      <rect width="46" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="23" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#c9d1d9">GSAP</text>
    </g>
    <g transform="translate(287, 120)">
      <rect width="86" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="43" y="14.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4" fill="#c9d1d9">Responsive</text>
    </g>

  <!-- artwork -->
  <g transform="translate(668, 34)">
    <rect x="0" y="0" width="112" height="86" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
    <path d="M0,8 A8,8 0 0,1 8,0 L104,0 A8,8 0 0,1 112,8 L112,18 L0,18 Z" fill="#0d1117"/>
    <line x1="0" y1="18" x2="112" y2="18" stroke="#30363d" stroke-width="1"/>
    <circle cx="12" cy="9" r="2.6" fill="#FF5F56"/>
    <circle cx="21" cy="9" r="2.6" fill="#FFBD2E"/>
    <circle cx="30" cy="9" r="2.6" fill="#27C93F"/>
    <rect x="44" y="6" width="56" height="6" rx="3" fill="#30363d"/>
    <!-- hero block -->
    <rect x="10" y="26" width="44" height="26" rx="4" fill="#8B5CF6" opacity="0.75">
      <animate attributeName="opacity" values="0.45;0.85;0.45" dur="4s" repeatCount="indefinite"/>
    </rect>
    <g fill="#30363d">
      <rect x="60" y="26" width="42" height="4" rx="2"/>
      <rect x="60" y="35" width="34" height="4" rx="2"/>
      <rect x="60" y="44" width="42" height="4" rx="2"/>
    </g>
    <!-- grid -->
    <g fill="#0d1117" stroke="#30363d" stroke-width="1">
      <rect x="10" y="60" width="28" height="16" rx="3"/>
      <rect x="42" y="60" width="28" height="16" rx="3"/>
      <rect x="74" y="60" width="28" height="16" rx="3"/>
    </g>
    <!-- cursor -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 46,26; 12,34; 0,0" dur="9s" repeatCount="indefinite"/>
      <path d="M56,52 L56,70 L61,65 L64,72 L67,70 L64,63 L70,63 Z" fill="#e6edf3" stroke="#0d1117" stroke-width="1.2"/>
    </g>
  </g>
</svg>
