<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 48" width="850" height="48" role="img" aria-label="About Me">
  <defs>
    <linearGradient id="sa-rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#3B82F6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="sa-txt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6edf3" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
  </defs>

  <!-- icon chip -->
  <rect x="1" y="7" width="34" height="34" rx="10" fill="#161b22" stroke="#8B5CF6" stroke-opacity="0.55" stroke-width="1.2" />
  <!-- glyph: terminal prompt -->
  <path d="M11 18 L16 24 L11 30" fill="none" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="18.5" y="28.5" width="7.5" height="2" rx="1" fill="#8B5CF6">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.6s" repeatCount="indefinite" />
  </rect>

  <text x="48" y="31" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" letter-spacing="0.2" fill="url(#sa-txt)">About Me</text>

  <text x="849" y="30" text-anchor="end" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="10.5" letter-spacing="2.2" fill="#8b949e">01 / WHOAMI</text>

  <rect x="0" y="46" width="850" height="1.1" fill="url(#sa-rule)" />
</svg>
