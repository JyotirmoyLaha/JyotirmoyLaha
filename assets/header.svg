<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="850" height="260" role="img" aria-label="Jyotirmoy Laha — Web Developer. Focus: AI/ML and web. Education: BCA, year 3.">
  <defs>
    <!-- Panel ground. A flat two-stop wash, no blur filters: the old header's
         feGaussianBlur halos were what made the type read as muddy. -->
    <linearGradient id="hd-ground" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0f1420"/>
    </linearGradient>

    <!-- Kept at 0.07: the light twin reuses this opacity, and anything higher
         tints the whole white panel lavender. -->
    <radialGradient id="hd-wash" cx="80%" cy="24%" r="58%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- The single moving idea: a narrow specular band travelling across the
         letterforms, the way light crosses a milled surface. Base offsets sit
         mid-name so the static (no-SMIL) render still looks deliberate. -->
    <linearGradient id="hd-sweep" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="400" y2="0">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset="0.40" stop-color="#e6edf3">
        <animate attributeName="offset" values="-0.35;1.00;1.00" keyTimes="0;0.55;1" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.50" stop-color="#a78bfa">
        <animate attributeName="offset" values="-0.25;1.10;1.10" keyTimes="0;0.55;1" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.60" stop-color="#e6edf3">
        <animate attributeName="offset" values="-0.15;1.20;1.20" keyTimes="0;0.55;1" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#e6edf3"/>
    </linearGradient>

    <linearGradient id="hd-rule" gradientUnits="userSpaceOnUse" x1="58" y1="0" x2="290" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ── panel ── -->
  <rect x="0.75" y="0.75" width="848.5" height="258.5" rx="14" fill="url(#hd-ground)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="0.75" y="0.75" width="848.5" height="258.5" rx="14" fill="url(#hd-wash)"/>

  <!-- ── registration marks: the piece's signature, static and precise ── -->
  <g fill="none" stroke="#8B5CF6" stroke-width="1.3" stroke-opacity="0.5" stroke-linecap="square">
    <path d="M20,33 L20,20 L33,20"/>
    <path d="M817,20 L830,20 L830,33"/>
    <path d="M20,227 L20,240 L33,240"/>
    <path d="M817,240 L830,240 L830,227"/>
  </g>

  <!-- ── eyebrow ── -->
  <rect x="58" y="54" width="26" height="2.5" rx="1.25" fill="#8B5CF6"/>
  <text x="94" y="59.5" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="10.5" font-weight="600" letter-spacing="2.6" fill="#8b949e">DEVELOPER PROFILE</text>

  <!-- ── name: stacked, tight leading, one weight ── -->
  <text x="56" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="58" font-weight="900" letter-spacing="-2" fill="url(#hd-sweep)">JYOTIRMOY</text>
  <text x="56" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="58" font-weight="900" letter-spacing="-2" fill="url(#hd-sweep)">LAHA</text>

  <rect x="58" y="206" width="232" height="1.6" fill="url(#hd-rule)"/>

  <text x="58" y="230" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="11" font-weight="600" letter-spacing="3" fill="#8b949e">WEB DEVELOPER</text>

  <!-- ── datasheet: the right side now carries information instead of
         decoration. Values are drawn from the About Me content. ── -->
  <rect x="572" y="92" width="1.5" height="106" fill="#30363d"/>

  <text x="592" y="116" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="9.5" letter-spacing="1.8" fill="#8b949e">ROLE</text>
  <text x="792" y="116" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3">Web Developer</text>
  <rect x="592" y="128" width="200" height="1" fill="#30363d"/>

  <text x="592" y="152" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="9.5" letter-spacing="1.8" fill="#8b949e">FOCUS</text>
  <text x="792" y="152" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3">AI / ML · Web</text>
  <rect x="592" y="164" width="200" height="1" fill="#30363d"/>

  <text x="592" y="188" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="9.5" letter-spacing="1.8" fill="#8b949e">STUDY</text>
  <text x="792" y="188" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3">BCA · Year 3</text>
</svg>
