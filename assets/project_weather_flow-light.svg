<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 130" width="850" height="130" role="img" aria-label="J.SkyCast architecture: a city search or browser geolocation lookup resolves a query, weatherapi.com returns forecast, air quality and astronomy data, which is parsed and rendered into a backdrop that reflects the current conditions.">
  <defs>
    <linearGradient id="wxf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="wxf-node" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
  </defs>

  <rect x="0.75" y="0.75" width="848.5" height="128.5" rx="14" fill="url(#wxf-bg)" stroke="#d0d7de" stroke-width="1.5"/>

  <g>
    <line x1="210" y1="65" x2="230" y2="65" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="3 4"/>
    <path d="M224,61.5 L230,65 L224,68.5" fill="none" stroke="#0891b2" stroke-opacity="0.7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cy="65" r="2.6" fill="#0891b2">
      <animate attributeName="cx" values="210;228" dur="2.2s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" begin="0s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <line x1="414" y1="65" x2="434" y2="65" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="3 4"/>
    <path d="M428,61.5 L434,65 L428,68.5" fill="none" stroke="#0891b2" stroke-opacity="0.7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cy="65" r="2.6" fill="#0891b2">
      <animate attributeName="cx" values="414;432" dur="2.2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <line x1="618" y1="65" x2="638" y2="65" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="3 4"/>
    <path d="M632,61.5 L638,65 L632,68.5" fill="none" stroke="#0891b2" stroke-opacity="0.7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cy="65" r="2.6" fill="#0891b2">
      <animate attributeName="cx" values="618;636" dur="2.2s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <rect x="28" y="28" width="180" height="74" rx="10" fill="url(#wxf-node)" stroke="#d0d7de" stroke-width="1.2"/>
    <rect x="40" y="39" width="19" height="17" rx="4" fill="#0891b2" fill-opacity="0.16" stroke="#0891b2" stroke-opacity="0.4" stroke-width="1"/>
    <text x="49.5" y="51" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="9" font-weight="700" fill="#0891b2">01</text>
    <text x="66" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1f2328">Resolve Location</text>
    <text x="40" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" fill="#59636e">City search or navigator</text>
    <text x="40" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" fill="#59636e">geolocation lookup.</text>
  </g>
  <g>
    <rect x="232" y="28" width="180" height="74" rx="10" fill="url(#wxf-node)" stroke="#d0d7de" stroke-width="1.2"/>
    <rect x="244" y="39" width="19" height="17" rx="4" fill="#0891b2" fill-opacity="0.16" stroke="#0891b2" stroke-opacity="0.4" stroke-width="1"/>
    <text x="253.5" y="51" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="9" font-weight="700" fill="#0891b2">02</text>
    <text x="270" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1f2328">WeatherAPI Fetch</text>
    <text x="244" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" fill="#59636e">Async request to</text>
    <text x="244" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" fill="#59636e">api.weatherapi.com.</text>
  </g>
  <g>
    <rect x="436" y="28" width="180" height="74" rx="10" fill="url(#wxf-node)" stroke="#d0d7de" stroke-width="1.2"/>
    <rect x="448" y="39" width="19" height="17" rx="4" fill="#0891b2" fill-opacity="0.16" stroke="#0891b2" stroke-opacity="0.4" stroke-width="1"/>
    <text x="457.5" y="51" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="9" font-weight="700" fill="#0891b2">03</text>
    <text x="474" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1f2328">Parse Metrics</text>
    <text x="448" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" fill="#59636e">Forecast, AQI, UV index</text>
    <text x="448" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" fill="#59636e">and astronomy extracted.</text>
  </g>
  <g>
    <rect x="640" y="28" width="180" height="74" rx="10" fill="url(#wxf-node)" stroke="#d0d7de" stroke-width="1.2"/>
    <rect x="652" y="39" width="19" height="17" rx="4" fill="#0891b2" fill-opacity="0.16" stroke="#0891b2" stroke-opacity="0.4" stroke-width="1"/>
    <text x="661.5" y="51" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="9" font-weight="700" fill="#0891b2">04</text>
    <text x="678" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1f2328">Render Scene</text>
    <text x="652" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" fill="#59636e">UI and backdrop swap to</text>
    <text x="652" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" fill="#59636e">match live conditions.</text>
  </g>
</svg>
