<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" height="140">
  <defs>
    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Theme Gradients -->
    <linearGradient id="theme-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Node Gradient -->
    <linearGradient id="node-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6f8fa" />
      <stop offset="100%" stop-color="#f6f8fa" />
    </linearGradient>
  </defs>

  <style>
    .card-border {
      fill: #ffffff;
      stroke: #d0d7de;
      stroke-width: 1.5;
      rx: 16;

    }.node-rect {
      fill: url(#node-grad);
      stroke: #d0d7de;
      stroke-width: 1.2;
      rx: 10;

    }
    .badge-rect {
      fill: rgba(56, 189, 248, 0.1);
      stroke: rgba(56, 189, 248, 0.3);
      stroke-width: 1;
      rx: 4;

    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 8.5px;
      font-weight: 800;
      fill: #0891b2;

    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #1f2328;

    }
    .text-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 9px;
      fill: #59636e;

    }
    .node-group {
      cursor: pointer;
    }.flow-line {
      stroke: #d0d7de;
      stroke-width: 2;
      stroke-linecap: round;
    }
    .flow-dot {
      fill: #0891b2;
    }
    .section-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 9.5px;
      font-weight: 800;
      fill: #0891b2;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Card Background -->
  <rect width="848" height="138" x="1" y="1" class="card-border" />

  <!-- Section Label -->
  <text x="30" y="26" class="section-label">HOW J.SKYCAST WEATHER WORKS (WEATHERAPI ENGINE)</text>

  <!-- ==================== CONNECTOR LINES & ANIMATED FLOW ==================== -->
  <!-- Connector 1 -> 2 -->
  <line x1="195" y1="78" x2="235" y2="78" class="flow-line" stroke-dasharray="4 4" />
  <circle cx="195" cy="78" r="3" class="flow-dot" filter="url(#glow)">
    <animate attributeName="cx" from="195" to="235" dur="1.8s" repeatCount="indefinite" />
  </circle>

  <!-- Connector 2 -> 3 -->
  <line x1="400" y1="78" x2="440" y2="78" class="flow-line" stroke-dasharray="4 4" />
  <circle cx="400" cy="78" r="3" class="flow-dot" filter="url(#glow)">
    <animate attributeName="cx" from="400" to="440" dur="1.8s" repeatCount="indefinite" />
  </circle>

  <!-- Connector 3 -> 4 -->
  <line x1="605" y1="78" x2="645" y2="78" class="flow-line" stroke-dasharray="4 4" />
  <circle cx="605" cy="78" r="3" class="flow-dot" filter="url(#glow)">
    <animate attributeName="cx" from="605" to="645" dur="1.8s" repeatCount="indefinite" />
  </circle>

  <!-- ==================== FLOW NODES ==================== -->
  
  <!-- Node 1: Query Input -->
  <g class="node-group">
    <rect x="30" y="42" width="165" height="72" class="node-rect" />
    <rect x="42" y="52" width="18" height="18" class="badge-rect" />
    <text x="51" y="64" text-anchor="middle" class="badge-text">01</text>
    <text x="68" y="65" class="text-title">Query Input</text>
    <text x="42" y="87" class="text-desc">User queries a city name or</text>
    <text x="42" y="99" class="text-desc">approves Geolocation GPS request.</text>
  </g>

  <!-- Node 2: WeatherAPI Fetch -->
  <g class="node-group">
    <rect x="235" y="42" width="165" height="72" class="node-rect" />
    <rect x="247" y="52" width="18" height="18" class="badge-rect" />
    <text x="256" y="64" text-anchor="middle" class="badge-text">02</text>
    <text x="273" y="65" class="text-title">WeatherAPI Fetch</text>
    <text x="247" y="87" class="text-desc">Sends async HTTP fetch queries</text>
    <text x="247" y="99" class="text-desc">for current metrics &amp; AQI.</text>
  </g>

  <!-- Node 3: Data Compiler -->
  <g class="node-group">
    <rect x="440" y="42" width="165" height="72" class="node-rect" />
    <rect x="452" y="52" width="18" height="18" class="badge-rect" />
    <text x="461" y="64" text-anchor="middle" class="badge-text">03</text>
    <text x="478" y="65" class="text-title">Data Compiler</text>
    <text x="452" y="87" class="text-desc">Extracts temperatures, dew point,</text>
    <text x="452" y="99" class="text-desc">UV and real-time sun position.</text>
  </g>

  <!-- Node 4: Dynamic SVG UI -->
  <g class="node-group">
    <rect x="645" y="42" width="165" height="72" class="node-rect" />
    <rect x="657" y="52" width="18" height="18" class="badge-rect" />
    <text x="666" y="64" text-anchor="middle" class="badge-text">04</text>
    <text x="683" y="65" class="text-title">Dynamic SVG UI</text>
    <text x="657" y="87" class="text-desc">Plots forecast charts &amp; swaps</text>
    <text x="657" y="99" class="text-desc">backgrounds based on weather.</text>
  </g>
</svg>
